<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 280px; padding: 15px; font-family: sans-serif; background: #f8f9fa; }
        h3 { margin-top: 0; color: #007bff; font-size: 16px; }
        input { width: 100%; padding: 8px; margin: 5px 0 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 5px; }
        #startBtn { background: #28a745; color: white; }
        #stopBtn { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <h3>Отчет: ЕПГУ + Готов</h3>
    <label>Дата начала:</label>
    <input type="text" id="startDate" placeholder="16.01.2026">
    <label>Дата конца:</label>
    <input type="text" id="endDate" placeholder="16.01.2026">
    <button id="startBtn">ЗАПУСТИТЬ</button>
    <button id="stopBtn">ОСТАНОВИТЬ</button>
    <script src="popup.js"></script>
</body>
</html>
