<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 320px; font-family: -apple-system, sans-serif; padding: 15px; background: #f8f9fa; color: #333; }
        .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        label { display: block; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 8px; transition: 0.2s; }
        #startBtn { background: #28a745; color: white; }
        #startBtn:hover { background: #218838; }
        #downloadBtn { background: #007bff; color: white; }
        #clearBtn { background: #dc3545; color: white; font-size: 11px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <label>Район (ОВД):</label>
        <input type="text" id="ovdName" placeholder="Например: Ленинский">

        <label>Период сбора:</label>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="startDate" placeholder="Начало">
            <input type="text" id="endDate" placeholder="Конец">
        </div>

        <button id="startBtn">ЗАПУСТИТЬ СБОР</button>
        <button id="downloadBtn">СКАЧАТЬ СВОДНЫЙ ОТЧЕТ</button>
        <button id="clearBtn">ОЧИСТИТЬ ПАМЯТЬ</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
